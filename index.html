<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>热量记录</title>
<style>
  :root {
    --ground:    #FAF9F7;
    --card:      #FFFFFF;
    --rule:      #17191C;
    --hair:      rgba(23, 25, 28, .13);
    --text:      #17191C;
    --text-dim:  #6B6E73;
    --text-faint:#9A9DA2;
    --brass:     #9A6F1E;
    --brass-bg:  rgba(184, 134, 47, .13);
    --good:      #2F7566;
    --over:      #A8402F;
    --track:     rgba(23, 25, 28, .09);
    --sel:       rgba(184, 134, 47, .09);
    --scrim:     rgba(0, 0, 0, .35);

    --f-label: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --f-num:   ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --f-body:  -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #17191C; --card: #1E2125; --rule: #E9E7E2;
      --hair: rgba(233, 231, 226, .15); --text: #E9E7E2; --text-dim: #9A9DA2;
      --text-faint: #6B6E73; --brass: #D5A44A; --brass-bg: rgba(213, 164, 74, .15);
      --good: #52A692; --over: #D2664F; --track: rgba(233, 231, 226, .11);
      --sel: rgba(213, 164, 74, .10); --scrim: rgba(0, 0, 0, .55);
    }
  }
  :root[data-theme="light"] {
    --ground: #FAF9F7; --card: #FFFFFF; --rule: #17191C;
    --hair: rgba(23, 25, 28, .13); --text: #17191C; --text-dim: #6B6E73;
    --text-faint: #9A9DA2; --brass: #9A6F1E; --brass-bg: rgba(184, 134, 47, .13);
    --good: #2F7566; --over: #A8402F; --track: rgba(23, 25, 28, .09);
    --sel: rgba(184, 134, 47, .09); --scrim: rgba(0, 0, 0, .35);
  }
  :root[data-theme="dark"] {
    --ground: #17191C; --card: #1E2125; --rule: #E9E7E2;
    --hair: rgba(233, 231, 226, .15); --text: #E9E7E2; --text-dim: #9A9DA2;
    --text-faint: #6B6E73; --brass: #D5A44A; --brass-bg: rgba(213, 164, 74, .15);
    --good: #52A692; --over: #D2664F; --track: rgba(233, 231, 226, .11);
    --sel: rgba(213, 164, 74, .10); --scrim: rgba(0, 0, 0, .55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground); color: var(--text);
    font-family: var(--f-body); -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; text-align: inherit; }
  input { font: inherit; color: inherit; }

  .page {
    max-width: 430px; margin: 0 auto;
    padding: 18px 16px calc(74px + env(safe-area-inset-bottom));
  }
  .view { display: flex; flex-direction: column; gap: 14px; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .topbar h1 { font-family: var(--f-label); font-size: 19px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .topbar .d { font-family: var(--f-num); font-size: 12px; color: var(--text-faint); }

  .mod {
    border: 1px solid var(--hair); border-radius: 12px;
    padding: 14px 15px; display: flex; flex-direction: column; gap: 10px;
    background: var(--card);
  }
  .mod-title {
    font-family: var(--f-label); font-size: 10px; font-weight: 800;
    letter-spacing: .15em; text-transform: uppercase; color: var(--text-faint);
  }
  .figure { display: flex; align-items: baseline; gap: 9px; }
  .figure .n {
    font-family: var(--f-num); font-variant-numeric: tabular-nums;
    font-size: 52px; font-weight: 500; letter-spacing: -.045em; line-height: .9;
  }
  .figure .n.over { color: var(--over); }
  .figure .n.zero { color: var(--text-faint); }
  @keyframes figPulse { from { color: var(--brass); } to { color: var(--text); } }
  .figure .n.flash { animation: figPulse .9s ease-out; }
  .figure .u { font-family: var(--f-label); font-size: 13px; font-weight: 700; color: var(--text-dim); }

  .bar { height: 9px; border-radius: 5px; background: var(--track); overflow: hidden; display: flex; }
  .bar > i { display: block; height: 100%; transition: width .25s ease; }
  .fill-brass { background: var(--brass); }
  .fill-good  { background: var(--good); }
  .fill-over  { background: var(--over); }

  .tchips { display: flex; gap: 8px; flex-wrap: wrap; }
  .tchip { padding: 8px 14px; border-radius: 16px; border: 1px solid var(--hair); background: var(--card);
           font-size: 13px; font-family: var(--f-label); font-weight: 600; color: var(--text-dim); }
  .tchip[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--card); }
  .ai-btns { display: flex; gap: 8px; }
  .ai-btns .btn { flex: 1; padding: 11px 6px; font-size: 13.5px; }
  .ai-text-row { display: flex; gap: 8px; margin-top: 8px; }
  .ai-text-row input { flex: 1; min-width: 0; padding: 10px; border: 1px solid var(--hair); border-radius: 8px;
    background: var(--ground); color: inherit; font-size: 13.5px; }
  .ai-text-row .btn { flex: none; width: auto; padding: 10px 14px; font-size: 13.5px; }
  /* 条形码：搜索框下两个入口 + 全屏取景层 + 扫码结果面板 */
  .scan-btns { display: flex; gap: 8px; margin-top: 8px; }
  .scan-btns .btn { flex: 1; padding: 9px 6px; font-size: 13px; }
  .scan-ov { position: fixed; inset: 0; z-index: 30; background: #000; color: #fff; }
  .scan-ov video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scan-ov .frame {
    position: absolute; left: 50%; top: 42%; width: min(80vw, 340px); height: min(36vw, 150px);
    transform: translate(-50%, -50%); border: 2px solid #fff; border-radius: 10px;
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .45);
  }
  .scan-ov .frame.hit { border-color: #6FD3A8; }
  .scan-ov .msg {
    position: absolute; left: 16px; right: 16px; top: calc(42% + min(18vw, 75px) + 16px);
    text-align: center; font-family: var(--f-label); font-size: 14px; font-weight: 600; line-height: 1.5;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
  }
  .scan-ov .sbar {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: center;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .scan-ov .sbar button {
    flex: 1; max-width: 140px; padding: 12px 6px; border-radius: 9px; font-family: var(--f-label); text-align: center;
    font-size: 14px; font-weight: 700; color: #fff; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .5);
  }
  .scan-ov .sbar button[aria-pressed="true"] { background: #fff; color: #000; }
  .sgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .sgrid label { display: flex; flex-direction: column; gap: 3px; font-family: var(--f-label); font-size: 10.5px; font-weight: 700; color: var(--text-faint); }
  .sgrid input { width: 100%; min-width: 0; padding: 9px 5px; border: 1px solid var(--hair); border-radius: 7px; background: var(--ground);
    color: inherit; font-size: 15px; text-align: right; font-family: var(--f-num); }
  .sgrid input.bad { border-color: var(--over); }
  .s-name { width: 100%; padding: 9px 10px; border: 1px solid var(--hair); border-radius: 7px; background: var(--ground); color: inherit; font-size: 15px; }
  .warnbox { font-size: 12px; line-height: 1.55; color: var(--over); border: 1px solid var(--over); border-radius: 7px; padding: 8px 10px; }
  .warnbox.ok { color: var(--good); border-color: var(--good); }
  .mrow { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .mrow .m-name { flex: 1; min-width: 0; padding: 9px 8px; border: 1px solid var(--hair); border-radius: 7px;
    background: var(--ground); color: inherit; font-size: 13px; }
  .mrow .m-g { width: 60px; flex: none; padding: 9px 6px; border: 1px solid var(--hair); border-radius: 7px;
    background: var(--ground); color: inherit; font-size: 13px; text-align: right; font-family: var(--f-num); }
  .mrow .m-k { flex: none; min-width: 56px; text-align: right; font-family: var(--f-num);
    font-variant-numeric: tabular-nums; font-size: 12px; }
  .mrow .m-x { flex: none; padding: 6px 7px; color: var(--text-faint); font-size: 14px; }
  .trow { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .trow .tl { font-family: var(--f-label); font-size: 12px; font-weight: 600; color: var(--text-dim); flex: none; width: 58px; }
  .trow input[type="range"] { flex: 1; min-width: 0; accent-color: var(--good); }
  .trow .tv { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 12px; flex: none; min-width: 74px; text-align: right; }
  .hint { font-size: 11.5px; color: var(--text-faint); line-height: 1.5; }
  .bar.thin { height: 4px; border-radius: 2px; }
  .hrow { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--hair); width: 100%; }
  .hrow.sel { background: var(--brass-bg); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 8px; border-bottom-color: transparent; }
  .hrow .hgo { flex: none; font-size: 13px; color: var(--text-faint); }
  .hrow:last-of-type { border-bottom: none; }
  .hrow .hl { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; }
  .hrow .hd { font-family: var(--f-num); color: var(--text-dim); flex: none; }
  .hrow .hk { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 700; flex: none; min-width: 44px; }
  .hrow .hk.over { color: var(--over); }
  .hrow .hw { font-family: var(--f-num); font-size: 11.5px; color: var(--text-dim); flex: 1; }
  .hrow .hi { flex: none; font-size: 11px; color: var(--text-dim); }
  .hrow .hm { font-size: 11px; color: var(--text-faint); font-family: var(--f-num); }
  .chip.combo { border-color: var(--brass); background: var(--brass-bg); color: var(--brass); }
  .uf-row { display: flex; align-items: center; gap: 6px; }
  .uf-row .r-item { flex: 1; min-width: 0; }
  .uf-del { flex: none; font-size: 12px; color: var(--over); padding: 6px 8px; border-radius: 6px; }
  .uf-del[data-armed] { background: var(--over); color: var(--card); }
  .rowline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; }
  .rowline .k { font-family: var(--f-label); font-weight: 600; color: var(--text-dim); }
  .rowline .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
  .rowline .v.warn { color: var(--over); font-weight: 600; }

  .split3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--hair); border-radius: 7px; overflow: hidden; }
  .split3 > div { background: var(--card); padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; }
  .split3 .k { font-family: var(--f-label); font-size: 9px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; color: var(--text-faint); }
  .split3 .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 17px; letter-spacing: -.03em; }

  .verdict { font-size: 12px; color: var(--text-dim); line-height: 1.5; padding-top: 9px; border-top: 1px solid var(--hair); }
  .verdict b { color: var(--brass); font-family: var(--f-num); font-weight: 600; }

  /* 提示条：同屏最多一条，当天可关 */
  .nudge {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    border: 1px solid var(--brass); background: var(--brass-bg); border-radius: 10px;
    padding: 11px 12px; width: 100%;
    font-family: var(--f-label); font-size: 13px; font-weight: 700; color: var(--brass);
  }
  .nudge.alarm { border-color: var(--over); color: var(--over); background: none; }
  .nudge.past { border-color: var(--brass); background: var(--brass); color: var(--card); }
  .nudge .x { font-size: 15px; padding: 0 3px; opacity: .7; flex: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--f-label); font-size: 12px; font-weight: 600;
    padding: 6px 9px; border-radius: 7px;
    border: 1px solid var(--hair); background: var(--ground);
    display: flex; align-items: center; gap: 6px;
  }
  .chip:active { border-color: var(--brass); background: var(--brass-bg); }
  .chip .kc { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-faint); }
  .chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 一个食物两个点法：左段=常用份量，右段=上次称的克数，挤在一颗胶囊里不会拆行 */
  .chipwrap { display: inline-flex; max-width: 100%; }
  .chipwrap .chip { min-width: 0; border-radius: 7px 0 0 7px; }
  .chipwrap .chip.lastg {
    flex: none; border-radius: 0 7px 7px 0; border-left: none;
    color: var(--text-dim); padding-left: 8px;
  }

  .search {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--hair); background: var(--ground);
  }
  /* 16px：小于 16 会触发 iOS 聚焦自动放大 */
  .search input { flex: 1; border: none; background: none; outline: none; font-size: 16px; min-width: 0; -webkit-appearance: none; }
  .search input::placeholder { color: var(--text-faint); }
  .search .clr { color: var(--text-faint); font-size: 14px; padding: 0 2px; }

  .results { display: flex; flex-direction: column; }
  .r-item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 10px 2px; border-bottom: 1px solid var(--hair); font-size: 14px; width: 100%;
  }
  .r-item:last-child { border-bottom: none; }
  .r-item .nm { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .r-item .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-item .kc { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-faint); flex: none; }
  .r-none { padding: 12px 2px 4px; font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .r-guess { font-family: var(--f-label); font-size: 13px; font-weight: 700; color: var(--brass); padding: 10px 2px; }

  .ledger { display: flex; flex-direction: column; }
  .meal-h { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0 5px; border-bottom: 2px solid var(--rule); }
  .meal-h .m { font-family: var(--f-label); font-size: 13px; font-weight: 800; }
  .meal-h .s { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; }
  .item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 9px 0 9px 11px; border-bottom: 1px solid var(--hair);
    font-size: 13.5px; width: 100%;
  }
  @keyframes rowIn { from { background: var(--brass-bg); } to { background: transparent; } }
  .item.flash, .w-row.flash { animation: rowIn 1.2s ease-out; }
  .item .nm { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .item .nm span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .q { font-family: var(--f-num); font-size: 11px; color: var(--text-faint); flex: none; }
  .item .kc { font-family: var(--f-num); font-variant-numeric: tabular-nums; flex: none; }
  .dot { width: 5px; height: 5px; border-radius: 50%; flex: none; align-self: center; margin-right: 1px; }
  .dot.hi { background: var(--good); }
  .dot.lo { background: var(--brass); }
  .dot.guess { background: none; border: 1px solid var(--text-faint); width: 4px; height: 4px; }
  .empty { padding: 14px 2px; font-size: 13px; color: var(--text-dim); line-height: 1.6; }

  .switchrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .switchrow .k { font-family: var(--f-label); font-size: 13.5px; font-weight: 700; }
  .switchrow .hint { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
  .sw { width: 46px; height: 28px; border-radius: 14px; background: var(--track); position: relative; flex: none; transition: background .15s ease; }
  .sw::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.25);
    transition: transform .15s ease;
  }
  .sw[aria-checked="true"] { background: var(--good); }
  .sw[aria-checked="true"]::after { transform: translateX(18px); }

  /* 底部弹出面板：上滑进入 + 遮罩渐入（减动效偏好由全局规则关闭） */
  .backdrop {
    position: fixed; inset: 0; background: var(--scrim);
    display: flex; align-items: flex-end; justify-content: center; z-index: 20;
    opacity: 0; visibility: hidden;
    transition: opacity .22s ease, visibility 0s linear .22s;
  }
  .backdrop.on { opacity: 1; visibility: visible; transition: opacity .22s ease; }
  .sheet {
    width: 100%; max-width: 430px; background: var(--card);
    border-radius: 14px 14px 0 0; border: 1px solid var(--brass); border-bottom: none;
    padding-bottom: env(safe-area-inset-bottom); overflow: hidden;
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.32,.72,.33,1);
  }
  .backdrop.on .sheet { transform: translateY(0); }
  .sheet-h { padding: 13px 15px 10px; border-bottom: 2px solid var(--rule); display: flex; flex-direction: column; gap: 3px; }
  .sheet-h .nm { font-family: var(--f-label); font-size: 15px; font-weight: 700; }
  /* §5.4：成分行禁止折行，超宽横向滚动 */
  .sheet-h .meta {
    font-family: var(--f-num); font-size: 11px; color: var(--text-faint);
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow-x: auto;
  }
  .sheet-b { padding: 12px 15px 16px; display: flex; flex-direction: column; gap: 10px; }
  .portions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .p {
    border: 1px solid var(--hair); border-radius: 7px; padding: 10px 11px;
    display: flex; flex-direction: column; gap: 2px; background: var(--ground); width: 100%;
  }
  .p:active, .p.hi { border-color: var(--brass); background: var(--brass-bg); }
  .p .l { font-family: var(--f-label); font-size: 13.5px; font-weight: 700; }
  .p .g { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-faint); }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-family: var(--f-label); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); }
  .field input {
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--hair);
    background: var(--ground); outline: none; font-size: 16px; width: 100%;
  }
  .field input:focus { border-color: var(--brass); }
  .field input.bad { border-color: var(--over); }
  .btn {
    padding: 12px; border-radius: 9px; width: 100%;
    font-family: var(--f-label); font-size: 14.5px; font-weight: 700; text-align: center;
    border: 1.5px solid var(--brass); color: var(--brass); background: var(--brass-bg);
  }
  .btn.solid { background: var(--brass); color: var(--card); }
  .btn.danger { border-color: var(--over); color: var(--over); background: none; }
  .btn.danger[data-armed] { background: var(--over); color: var(--card); }
  .btn.plain { border-color: var(--hair); color: var(--text-dim); background: none; }
  .btn:disabled { opacity: .4; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--hair); border-radius: 8px; overflow: hidden; }
  .seg.c3 { grid-template-columns: repeat(3, 1fr); }
  .seg.c4 { grid-template-columns: repeat(4, 1fr); }
  .seg button { background: var(--ground); padding: 10px 4px; font-family: var(--f-label); font-size: 12.5px; font-weight: 700; color: var(--text-dim); text-align: center; }
  .seg button[aria-pressed="true"] { background: var(--brass-bg); color: var(--brass); }

  /* 体重快捷加减 */
  .kgrow { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: stretch; }
  .kgrow button {
    border: 1px solid var(--hair); border-radius: 8px; background: var(--ground);
    font-family: var(--f-num); font-size: 15px; font-weight: 600; text-align: center; color: var(--text-dim);
  }
  .kgrow button:active { border-color: var(--brass); color: var(--brass); background: var(--brass-bg); }
  .kgrow input { text-align: center; font-family: var(--f-num); font-variant-numeric: tabular-nums; }

      '这个数据库偶尔会慢几分钟（2026-09-28 实测过一次），过一会儿再查通常就好。</div>' +

function offName(p, code) {

/* Open Food Facts 的一条商品 → 本页的食物格式；没有热量就当查不到 */
function offToSpec(p, code) {
  var n = p.nutriments || {}, sq = Number(p.serving_quantity);
  function val(k) {
    var v = n[k + "_100g"];
    if ((v === "" || v == null) && sq > 0 && n[k + "_serving"] != null && n[k + "_serving"] !== "") v = Number(n[k + "_serving"]) * 100 / sq;
    v = Number(v);
    return (v === v && isFinite(v) && v >= 0) ? v : null;   /* v === v 排除 NaN */
  }
  var kcal = val("energy-kcal");
  if (kcal == null) { var kj = val("energy-kj"); if (kj == null) kj = val("energy"); if (kj != null) kcal = kj / 4.184; }

  var per = { kcal: Math.round(kcal), protein: r1(val("proteins")), fat: r1(val("fat")), carb: r1(val("carbohydrates")) };
  var extra = { fiber: r1(val("fiber")), polyols: r1(val("polyols")), alcohol: r1(val("alcohol")) };

  if (sq > 0 && sq <= MAX_G) ports.push({ label: "一份（标签）" + Math.round(sq) + u, grams: Math.round(sq) });
  if (pq > 0 && pq <= MAX_G && Math.round(pq) !== Math.round(sq)) ports.push({ label: "整包 " + Math.round(pq) + u, grams: Math.round(pq) });
  if (!ports.some(function (x) { return x.grams === 100; })) ports.push({ label: "100 " + u, grams: 100 });

/* 算术核对：蛋白×4＋脂肪×9＋碳水×4＋纤维×2（英国标签碳水不含纤维；糖醇按 2.4、酒精按 7）对标称热量 */
function scanChecks(per, extra) {
  var w = [];
  ["protein", "fat", "carb"].forEach(function (k) {
    if (per[k] == null) w.push({ protein: "蛋白质", fat: "脂肪", carb: "碳水" }[k] + "没有数据，照标签补上再存（空着按 0 算会压低当天数字）");
  });
  var P = per.protein || 0, F = per.fat || 0, C = per.carb || 0;
  var poly = Math.min(extra.polyols || 0, C);
  var calc = 4 * P + 9 * F + 4 * (C - poly) + 2.4 * poly + 2 * (extra.fiber || 0) + 7 * (extra.alcohol || 0);
  if (per.kcal >= 20 && Math.abs(calc - per.kcal) > Math.max(20, per.kcal * 0.15)) {
    w.push("热量和碳蛋脂对不上：标 " + per.kcal + " kcal，按碳蛋脂" + (extra.fiber ? "纤维" : "") + "算约 " + Math.round(calc) + "，可能有人录错了，对着包装核一下");
  }

    return { f: f, common: common, ratio: common / Math.max(1, Math.min(a.length, b.length)) };
  }).filter(function (x) { return x.common >= 2 && x.ratio >= 0.5; })
    .sort(function (x, y) { return y.common - x.common || y.ratio - x.ratio; })

  /* 按日历天列，没记录的那天也列出来——漏记一整天才更需要点进去补 */
  var first = null;

  var n = histExpanded ? 14 : 7;

var importInput = document.createElement("input");
importInput.type = "file"; importInput.accept = ".json,application/json"; importInput.style.display = "none";
document.body.appendChild(importInput);
importInput.addEventListener("change", function () {
  var file = importInput.files && importInput.files[0];
  if (!file) return;
  var rd = new FileReader();
  rd.onload = function () { importBackup(String(rd.result)); };
  rd.onerror = function () { alert("文件读取失败。"); };
  rd.readAsText(file);
});
function mergeMissing(cur, add, keyFn) {
  var seen = {}, n = 0;
  cur.forEach(function (x) { seen[keyFn(x)] = 1; });
  (Array.isArray(add) ? add : []).forEach(function (x) {
    if (!x || typeof x !== "object") return;
    var k = keyFn(x);
    if (k == null || seen[k]) return;
    seen[k] = 1; cur.push(x); n++;
  });
  return n;
}
function importBackup(txt) {
  var d;
  try { d = JSON.parse(txt); } catch (e) { alert("这不是有效的备份文件（读不懂里面的内容）。"); return; }
  if (!d || d.schema !== "caltrk-export.v1" || !Array.isArray(d.log)) { alert("这不是热量记录导出的备份文件。"); return; }
  if (storeBroken) { alert("本机存储异常，先别导入：请先导出现有数据。"); return; }
  reloadDB(); USER_FOODS = loadArr(UF_KEY);   /* 以存储里最新的为准 */
  var nx = { log: DB.log.slice(), weight: DB.weight.slice(), days: DB.days.slice(), training: DB.training.slice(), uf: USER_FOODS.slice() };
  var c = {
    log: mergeMissing(nx.log, d.log, function (e) { return e.id || null; }),
    weight: mergeMissing(nx.weight, d.weight, function (w) { return w.date ? w.date + "|" + w.context : null; }),
    days: mergeMissing(nx.days, d.days, function (x) { return x.date || null; }),
    training: mergeMissing(nx.training, d.training, function (x) { return x.date || null; }),
    uf: mergeMissing(nx.uf, d.user_foods, function (f) { return f.id || null; })
  };
  /* 设置：流水更正记账取并集，条形码关联补缺，其余只补这台手机没有的键 */
  var st = JSON.parse(JSON.stringify(DB.settings)), stN = 0, ds = d.settings;
  if (ds && typeof ds === "object" && !Array.isArray(ds)) {
    Object.keys(ds).forEach(function (k) {
      if (k === "log_fix_done" && Array.isArray(ds[k])) {
        var have = Array.isArray(st[k]) ? st[k] : [];
        ds[k].forEach(function (x) { if (have.indexOf(x) < 0) { have.push(x); stN++; } });
        st[k] = have;
      } else if (k === "barcode_map" && ds[k] && typeof ds[k] === "object") {
        if (!st[k]) st[k] = {};
        Object.keys(ds[k]).forEach(function (b) { if (!st[k][b]) { st[k][b] = ds[k][b]; stN++; } });
      } else if (!(k in st)) { st[k] = ds[k]; stN++; }
    });
  }
  if (!st.last_export_confirm && d.exported_at) { st.last_export_confirm = d.exported_at; stN++; }
  var total = c.log + c.weight + c.days + c.training + c.uf;
  if (!total) { alert("备份里的记录这台手机都有了，不用导入。"); return; }
  if (!confirm("备份导出于 " + (d.exported_at || "?") + "（v" + (d.app_version || "?") + "）。\n" +
      "会补上这台手机没有的：\n· 摄入记录 " + c.log + " 条\n· 体重 " + c.weight + " 次\n· 记全标记 " + c.days +
      " 天\n· 训练 " + c.training + " 天\n· 我的食物 " + c.uf + " 个\n已有的记录一条都不改。导入？")) return;
  /* 按时间排好：「上次克数」等功能从后往前找最近一条 */
  nx.log.sort(function (a, b) { return (a.ts || "") < (b.ts || "") ? -1 : (a.ts || "") > (b.ts || "") ? 1 : 0; });
  persist(K.log, nx.log);
  persist(K.weight, nx.weight);
  persist(K.days, nx.days);
  persist(K.training, nx.training);
  persist(UF_KEY, nx.uf);
  persist(K.settings, st);
  reloadDB(); USER_FOODS = loadArr(UF_KEY);
  VIEWS[activeTab()]();
  renderBanner();
  alert(storeBroken ? "导入时存储写入失败，请截图并联系分析端。" :
    "导入完成：现在共 " + DB.log.length + " 条摄入记录、" + DB.weight.length + " 次体重。" +
    (aiReady() ? "" : "\nAI 密钥不在备份里，记得在这一页重新填。"));
}
function doExport() {
  var payload = {
    schema: "caltrk-export.v1",
    exported_at: nowTs(),
    app_version: BUILD.version,
    log: DB.log, weight: DB.weight, days: DB.days, training: DB.training,
    user_foods: USER_FOODS,
    settings: DB.settings   /* v1.15.0 起带上：条形码关联、已做过的流水更正等。AI 密钥不在这里，不会导出 */
  };
  /* 附带解析失败时抢救下来的原始串，供电脑侧恢复 */
  var baks = {};
  [K.log, K.weight, K.days, K.settings, K.training, UF_KEY].forEach(function (k) {
    try {
      var b = localStorage.getItem(k + ".bak");
      if (b != null) baks[k] = b;

  });
  if (Object.keys(baks).length) payload.corrupt_backups = baks;
  var name = "热量日志-" + todayStr() + ".json";
  var url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 1)], { type: "application/json" }));
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);

  DB.settings.last_export_confirm = nowTs();
  persist(K.settings, DB.settings);
  renderExport();
}

  else if (act === "dismiss-banner") {
    ev.stopPropagation();
    dismissBanner(b.getAttribute("data-kind"));
  }
  else if (act === "go-weight") switchTab("weight");
  else if (act === "go-export") switchTab("export");
  else if (act === "go-complete") {
    var cm = document.getElementById("complete-mod");
    if (cm) cm.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  else if (act === "ctx-morning") { weightCtx = "morning"; weightCtxTouched = true; renderWeight(); }
  else if (act === "ctx-gym") { weightCtx = "gym_pre"; weightCtxTouched = true; renderWeight(); }
  else if (act === "ctx-other") { weightCtx = "other"; weightCtxTouched = true; renderWeight(); }
  else if (act === "kg-minus") stepKg(-0.1);
  else if (act === "kg-plus") stepKg(0.1);
  else if (act === "save-weight") saveWeight();
  else if (act === "do-export") doExport();
  else if (act === "do-import") { importInput.value = ""; importInput.click(); }
}, true);

/* 估餐确认面板：名字/克数即时生效，热量跟着变 */
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (!t.hasAttribute) return;
  if (t.hasAttribute("data-mg")) {
    var i = parseInt(t.getAttribute("data-mg"), 10);
    if (MEAL_DRAFT && MEAL_DRAFT.items[i]) {
      var g = parseFloat(t.value);
      MEAL_DRAFT.items[i].grams = (g > 0 && g <= MAX_G) ? g : 0;
      t.classList.toggle("bad", !!t.value && !(g > 0 && g <= MAX_G));
      mealRecalc();
    }
  } else if (t.hasAttribute("data-sper")) {
    scanWarnRefresh();
  } else if (t.hasAttribute("data-mname")) {
    var j = parseInt(t.getAttribute("data-mname"), 10);
    if (MEAL_DRAFT && MEAL_DRAFT.items[j]) MEAL_DRAFT.items[j].name = t.value.slice(0, 30);
  }
}, true);
/* 训练时长滑杆：拖动中只更新文字（避免重建打断手势），松手才落盘重绘 */
document.addEventListener("input", function (ev) {
  var s = ev.target;
  if (!s.hasAttribute || !s.hasAttribute("data-tmin")) return;
  var type = s.getAttribute("data-tmin");
  var m = parseInt(s.value, 10);
  setTrainingMin(type, m);
  var p = presetOf(type);
  var tv = document.getElementById("tv-" + type);
  if (tv && p) tv.textContent = m + "分·" + Math.round(m * p.rate);
  var rec = trainingOfView();
  var estK = 0, estM = 0;
  if (rec) rec.types.forEach(function (t) { estK += trainingKcal(rec, t); estM += trainingMin(rec, t); });
  var te = document.getElementById("t-est");
  if (te) te.textContent = "约 " + estK + " kcal · " + estM + " 分钟";
}, true);
document.addEventListener("change", function (ev) {
  if (ev.target.hasAttribute && ev.target.hasAttribute("data-tmin")) renderTodayBottom();
  /* 模型下拉选「自定义…」时显示手输框 */
  if (ev.target.hasAttribute && ev.target.hasAttribute("data-modelsel")) {
    var ci = document.getElementById(ev.target.getAttribute("data-modelsel"));
    if (ci) ci.style.display = ev.target.value === "__custom" ? "" : "none";
  }
}, true);

/* ── 启动与刷新 ─────────────────────────────────────────── */
var shownDate = todayStr();
viewDate = shownDate;           /* 每次打开都从今天开始看 */
document.getElementById("tb-date").textContent = shownDate;
switchTab("today");

function refreshIfNeeded(force) {
  var t = todayStr();
  var dateChanged = t !== shownDate;
  if (dateChanged) {
    shownDate = t;
    viewDate = t;               /* 跨午夜：回到新的今天，别把今天的饭记进昨天 */
    document.getElementById("tb-date").textContent = t;
  }
  if (dateChanged || force) {
    /* 正在输入时不强刷，避免清掉输入了一半的内容 */
    var ae = document.activeElement;
    if (!ae || (ae.tagName !== "INPUT" && ae.tagName !== "TEXTAREA")) VIEWS[activeTab()]();
    else if (dateChanged) VIEWS[activeTab()]();
  }
}
/* 切回前台：先从存储重读（防旧标签页用过期内存覆盖新记录），再判断要不要重绘 */
var hiddenAt = 0;
document.addEventListener("visibilitychange", function () {
  if (document.hidden) { hiddenAt = Date.now(); scanClose(); }   /* 切走就关摄像头 */
});
function onVisible() {
  if (document.hidden) return;
  /* 翻回过去某天改完就切走了，隔了 REVERT_MIN 分钟再回来当作新的一次使用：跳回今天 */
  var reverted = false;
  if (!viewingToday() && hiddenAt && Date.now() - hiddenAt > REVERT_MIN * 60000) { viewDate = todayStr(); reverted = true; }
  var before = JSON.stringify([DB.log.length, DB.weight.length, DB.days.length]);
  if (!storeBroken) reloadDB();
  var after = JSON.stringify([DB.log.length, DB.weight.length, DB.days.length]);
  refreshIfNeeded(before !== after || reverted);
}
document.addEventListener("visibilitychange", onVisible);
window.addEventListener("pageshow", onVisible);
/* 前台跨午夜：30 秒哨兵，翻日自动切到新一天，防止「记全了」打到错误日期 */
setInterval(function () { refreshIfNeeded(false); }, 30000);
</script>
</body>
